services:
  mysql:
    image: mysql:8.0
    container_name: lavanderia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lavanderia_auth}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: lavanderia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lavanderia_laundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backend/auth-service
    container_name: lavanderia-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lavanderia_auth}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-super-seguro-para-jwt-1234567890}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user123}
    ports:
      - "8081:8081"

  laundry-service:
    build: ./backend/laundry-service
    container_name: lavanderia-laundry-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lavanderia_laundry
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-super-seguro-para-jwt-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8082:8082"

  order-service:
    build: ./backend/order-service
    container_name: lavanderia-order-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      laundry-service:
        condition: service_started
    environment:
      PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lavanderia_orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-super-seguro-para-jwt-1234567890}
      LAUNDRY_SERVICE_URL: http://laundry-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8083:8083"

  frontend:
    build: ./frontend
    container_name: lavanderia-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - laundry-service
      - order-service
    environment:
      AUTH_API_URL: ${AUTH_API_URL:-http://localhost:8081}
      LAUNDRY_API_URL: ${LAUNDRY_API_URL:-http://localhost:8082}
      ORDER_API_URL: ${ORDER_API_URL:-http://localhost:8083}
    ports:
      - "4200:80"

volumes:
  mysql_data:
  postgres_data:
