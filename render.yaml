# =================================================================
# Render Blueprint: PostgreSQL + 3 backends + frontend
# Valores por defecto para que el primer deploy funcione sin pegar nada.
# LAUNDRY_SERVICE_URL y las URLs del frontend se resuelven con RENDER_EXTERNAL_URL.
# =================================================================

databases:
  - name: lavanderia-postgres
    databaseName: lavanderia
    user: lavanderia
    plan: free
    region: oregon

services:
  - type: web
    name: lavanderia-auth-service
    runtime: docker
    rootDir: backend/auth-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Render espera que la app escuche en el puerto de esta variable (por defecto 10000 en Docker)
      - key: PORT
        value: "10000"
      - key: RENDER_JDBC_SSLMODE
        value: require
      - key: JPA_DDL_AUTO
        value: update
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        value: w7KpQmN9xR2vL5jH8tY4cF6bD1sA0eU3gZ
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        value: AdminPass2026Lav
      - key: SEED_USER_USERNAME
        value: user
      - key: SEED_USER_PASSWORD
        value: UserPass2026Lav

  - type: web
    name: lavanderia-laundry-service
    runtime: docker
    rootDir: backend/laundry-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: RENDER_JDBC_SSLMODE
        value: require
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        value: w7KpQmN9xR2vL5jH8tY4cF6bD1sA0eU3gZ
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: lavanderia-order-service
    runtime: docker
    rootDir: backend/order-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: RENDER_JDBC_SSLMODE
        value: require
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        value: w7KpQmN9xR2vL5jH8tY4cF6bD1sA0eU3gZ
      # URL pública https del laundry (Render la inyecta en cada servicio como RENDER_EXTERNAL_URL)
      - key: LAUNDRY_SERVICE_URL
        fromService:
          name: lavanderia-laundry-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: lavanderia-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_API_URL
        fromService:
          name: lavanderia-auth-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LAUNDRY_API_URL
        fromService:
          name: lavanderia-laundry-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ORDER_API_URL
        fromService:
          name: lavanderia-order-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
