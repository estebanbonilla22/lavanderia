# =================================================================
# Infraestructura como código para Render (https://render.com)
#
# Este archivo declara:
#  - 1 PostgreSQL gestionado por Render (usado por laundry-service y order-service)
#  - 3 Web Services backend (Spring Boot) construidos con Docker
#  - 1 Web Service frontend (Angular + nginx) construido con Docker
#
# IMPORTANTE para auth-service:
#   Render no ofrece MySQL gestionado en su plan gratuito. Tienes 2 opciones:
#     A) Usar un MySQL externo (PlanetScale, Aiven, Clever Cloud, etc.) y poner la
#        URL JDBC en la variable SPRING_DATASOURCE_URL del auth-service.
#     B) Adaptar auth-service a Postgres (cambia el driver y el dialect).
#
# Lee el README.md (sección Render) para ver el paso a paso.
# =================================================================

databases:
  - name: lavanderia-postgres
    databaseName: lavanderia
    user: lavanderia
    plan: free
    region: oregon

services:
  # ----------------------- AUTH SERVICE (MySQL externo) -----------------------
  - type: web
    name: lavanderia-auth-service
    runtime: docker
    rootDir: backend/auth-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8081"
      - key: JPA_DDL_AUTO
        value: update
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # Configura estos valores manualmente en el dashboard de Render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_USERNAME
        value: user
      - key: SEED_USER_PASSWORD
        sync: false

  # ----------------------- LAUNDRY SERVICE (Postgres Render) -----------------------
  - type: web
    name: lavanderia-laundry-service
    runtime: docker
    rootDir: backend/laundry-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8082"
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      # ¡Debe ser idéntico al JWT_SECRET del auth-service!
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ----------------------- ORDER SERVICE (Postgres Render) -----------------------
  - type: web
    name: lavanderia-order-service
    runtime: docker
    rootDir: backend/order-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8083"
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      # Configura manualmente con la URL completa, ej:
      #   https://lavanderia-laundry-service.onrender.com
      - key: LAUNDRY_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ----------------------- FRONTEND (Angular + nginx) -----------------------
  - type: web
    name: lavanderia-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_API_URL
        sync: false
      - key: LAUNDRY_API_URL
        sync: false
      - key: ORDER_API_URL
        sync: false
