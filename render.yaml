# =================================================================
# Render: 1 PostgreSQL + 3 backends + frontend (todo sobre Postgres)
# =================================================================

databases:
  - name: lavanderia-postgres
    databaseName: lavanderia
    user: lavanderia
    plan: free
    region: oregon

services:
  - type: web
    name: lavanderia-auth-service
    runtime: docker
    rootDir: backend/auth-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8081"
      - key: JPA_DDL_AUTO
        value: update
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_USERNAME
        value: user
      - key: SEED_USER_PASSWORD
        sync: false

  - type: web
    name: lavanderia-laundry-service
    runtime: docker
    rootDir: backend/laundry-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8082"
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: lavanderia-order-service
    runtime: docker
    rootDir: backend/order-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8083"
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lavanderia-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lavanderia-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lavanderia-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      - key: LAUNDRY_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: lavanderia-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_API_URL
        sync: false
      - key: LAUNDRY_API_URL
        sync: false
      - key: ORDER_API_URL
        sync: false
