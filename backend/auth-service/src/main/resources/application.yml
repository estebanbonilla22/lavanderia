server:
  port: ${PORT:8081}
  error:
    include-message: always

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lavanderia_auth?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

security:
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-super-seguro-para-jwt-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:lavanderia-auth}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

seed:
  admin:
    username: ${SEED_ADMIN_USERNAME:admin}
    email: ${SEED_ADMIN_EMAIL:admin@lavanderia.com}
    password: ${SEED_ADMIN_PASSWORD:admin123}
  user:
    username: ${SEED_USER_USERNAME:user}
    email: ${SEED_USER_EMAIL:user@lavanderia.com}
    password: ${SEED_USER_PASSWORD:user123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
